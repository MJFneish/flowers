<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glowing Flowers</title>
  <meta name="description" content="A night garden of glowing flowers that grow and bloom — pure HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#050308">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layers.css">
  <link rel="stylesheet" href="assets/css/banner.css">
  <link rel="stylesheet" href="assets/css/hint.css">
  <link rel="stylesheet" href="assets/css/controls.css">
</head>
<body>
  <!-- Main scene: stems, leaves, petals, grass, bees, particles -->
  <canvas id="garden" role="img" aria-label="Animated night garden where glowing flowers grow and bloom"></canvas>

  <!-- Bloom layer: a blurred, low-res copy of the scene blended on top for the glow -->
  <canvas id="glow" aria-hidden="true"></canvas>

  <div class="vignette" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- Announces rare and legendary blooms -->
  <div class="banner" id="banner" role="status" aria-live="polite">
    <span class="banner-tag" id="bannerTag"></span>
    <span class="banner-name" id="bannerName"></span>
  </div>

  <p class="hint" id="hint"></p>

  <button class="ctl replay" id="replay" type="button" aria-label="Replay animation" title="Replay">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 3-6.7"/>
      <path d="M3 4v5h5"/>
    </svg>
  </button>

  <div class="controls" role="toolbar" aria-label="View controls">
    <button class="ctl" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in (+)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="ctl" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out (−)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M5 12h14"/>
      </svg>
    </button>
    <button class="ctl" id="zoomFit" type="button" aria-label="Show the whole garden" title="Whole garden (0)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
    <button class="ctl" id="motion" type="button" hidden aria-label="Enable shake to sway" title="Shake your phone to sway the flowers">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="3" width="8" height="18" rx="2"/>
        <path d="M4 8v8M20 8v8"/>
      </svg>
    </button>
  </div>

  <!-- Shown only if the scripts can't load (browsers block modules on pages opened as a file) -->
  <div class="boot-note" id="bootNote" role="alert" hidden>
    <strong>Almost there</strong>
    This garden is built from JavaScript modules, and browsers block those when a page is opened
    straight from a file. Open it through a local server instead — for example the VS Code
    <em>Live Server</em> extension, or run <code>npx serve</code> in this folder.
  </div>

  <script type="module" src="assets/js/main.js" onerror="document.getElementById('bootNote').hidden = false"></script>
</body>
</html>
