<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glowing Flowers</title>
  <meta name="description" content="A night garden of glowing flowers that grow and bloom — pure HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#050308">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main scene: stems, leaves, petals, grass, particles -->
  <canvas id="garden" role="img" aria-label="Animated night garden where glowing orange flowers grow and bloom"></canvas>

  <!-- Bloom layer: a blurred, low-res copy of the scene blended on top for the glow -->
  <canvas id="glow" aria-hidden="true"></canvas>

  <div class="vignette" aria-hidden="true"></div>

  <p class="hint" id="hint">Tap anywhere to grow a flower</p>

  <button class="replay" id="replay" type="button" aria-label="Replay animation" title="Replay">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 3-6.7"/>
      <path d="M3 4v5h5"/>
    </svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
